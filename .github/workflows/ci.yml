name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # Packaging-correctness gate (dual CJS/ESM types + exports). attw exits
      # non-zero on a types masquerade; publint on a packaging error.
      - run: npx publint
      - run: npx @arethetypeswrong/cli --pack
